name: 不具合の報告
description: 機能が動かない、表示がおかしいなどの問題を報告する
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。投稿の前に、同じ内容の Issue がないか検索してください。

        **e-class の画面には氏名・学生番号・履修科目などが含まれます。スクリーンショットや HTML を貼るときは、必ず該当箇所を隠してください。**

        脆弱性は、この Issue ではなく [非公開の報告](https://github.com/kmch4n/BetterE-class/security/advisories/new) から知らせてください。
  - type: textarea
    id: summary
    attributes:
      label: 起きていること
      description: どのような問題が起きているかを書いてください。
      placeholder: 教材ページで「保存」を押しても、ダウンロードが始まらない
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現の手順
      placeholder: |
        1. コースページから教材を開く
        2. 目次の上の「保存」を押す
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      placeholder: 選んでいる節の資料がダウンロードされる
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 起きたページの URL
      description: "`?` から後ろは省いてかまいません。"
      placeholder: https://eclass.doshisha.ac.jp/webclass/txtbk_show_chapter.php
  - type: input
    id: version
    attributes:
      label: BetterE-class のバージョン
      description: 設定画面の左上か、e-class のページ下部に表示されています。
      placeholder: v1.8.3
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: ブラウザと OS
      placeholder: Chrome 141 / Windows 11
  - type: textarea
    id: extra
    attributes:
      label: 補足
      description: コンソールのエラー、スクリーンショット（個人情報は隠す）、オンにしている設定など。
